[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-assistant"
version = "0.1.0"
description = "Plateforme RAG + agents répondant à des questions de cybersécurité, durcie contre les attaques propres aux LLM."
# 3.12 et non 3.11 : les stubs de numpy, tire par sentence-transformers,
# utilisent la syntaxe PEP 695 qui n'existe qu'a partir de 3.12. Conserver un
# plancher 3.11 rendrait le typage impossible, pour une compatibilite qui n'est
# ni testee ni executee nulle part.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    # Client HTTP asynchrone : appels a Ollama. Etait en dependance de dev
    # (TestClient) ; devient une dependance d'execution avec OllamaProvider.
    "httpx>=0.27",
    # Utilise directement pour deporter la vectorisation hors de la boucle
    # d'evenements. Arrive aussi via starlette, mais un import direct se declare.
    "anyio>=4.0",
    # Logs structures (ticket 23, ADR-0014). Choisi pour son integration avec le
    # module `logging` standard : les appels existants traversent la meme chaine
    # de traitement sans etre reecrits, et les bibliotheques tierces aussi.
    "structlog>=24.1",
    # Tracage (ticket 24, ADR-0015). Emet en OpenTelemetry : les traces restent
    # portables vers n'importe quel collecteur si Langfuse disparaissait.
    "langfuse>=4.0",
    # Embeddings locaux (ADR-0006). Tire torch : environ 200 Mo de wheel.
    # Plancher a 5.7 : version ou l'on s'appuie sur get_embedding_dimension
    # plutot que sur son alias deprecie. Verifie en 5.7 et en 6.0.
    #
    # Pas de plafond majeur, mais une lecon : la sortie de la 6.0 a fait echouer
    # la CI sans qu'une ligne de notre code ne change — le parametre de encode()
    # y est renomme. Le protocole a ete rendu insensible a ce renommage plutot
    # que de figer la version. La vraie parade a cette classe de probleme est un
    # fichier de verrouillage (uv lock), a envisager en M6.
    "sentence-transformers>=5.7",
    # Base vectorielle (ADR-0005). Le mode ":memory:" du client embarque le
    # vrai moteur Qdrant : les tests unitaires n'ont besoin d'aucun conteneur.
    "qdrant-client>=1.19",
    # Orchestration de l'agent (ADR-0001, ADR-0011). Tire 22 paquets
    # transitifs, dont langchain-core et langsmith : c'est la dependance la plus
    # lourde du projet en nombre de paquets, donc en surface de chaine
    # d'approvisionnement (LLM03). Le cout est assume et documente dans
    # l'ADR-0011 ; en contrepartie, le graphe est le seul module a en dependre,
    # et les appels au modele passent par notre propre interface.
    "langgraph>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Scans securite executes en CI (voir .github/workflows/ci.yml)
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests d'integration sont exclus par defaut : ils telechargent des modeles
# ou exigent un service (Qdrant, Ollama). La suite par defaut doit rester
# rapide et executable hors ligne, sinon on cesse de la lancer.
# Les lancer explicitement avec : pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: necessite un service externe ou un modele telecharge",
    # Marqueur distinct parce que la CI peut demarrer un conteneur Qdrant et
    # telecharger le modele d'embeddings (220 Mo), mais pas heberger Ollama et
    # ses 4,9 Go de poids. La CI lance donc : pytest -m "integration and not llm".
    "llm: exige un serveur Ollama joignable ; non executable en CI",
    # Meme logique que `llm`, pour une autre raison : la CI ne doit pas dependre
    # de la disponibilite ni du quota d'un service tiers. Un test qui echoue
    # parce que le NIST est lent n'apprend rien sur notre code, et une CI qui
    # rougit sans raison finit par ne plus etre lue.
    "network: exige un acces sortant vers un service tiers ; non executable en CI",
]

[tool.bandit]
# Le SAST ne scanne que le code applicatif : les tests contiennent
# volontairement des charges malveillantes (tests/security/).
exclude_dirs = ["tests", ".venv"]
