services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      # Dans le reseau compose, Qdrant se joint par son nom de service et non
      # par localhost : chaque conteneur a sa propre boucle locale.
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    # Version epinglee : "latest" ferait changer le moteur sous nos pieds au
    # premier `docker compose pull`, sans que rien ne l'indique dans le depot.
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"   # API REST + tableau de bord
      - "6334:6334"   # API gRPC, plus rapide (non utilisee pour l'instant)
    volumes:
      - qdrant_storage:/qdrant/storage   # les donnees survivent aux redemarrages
    healthcheck:
      # L'image ne contient ni curl, ni wget, ni nc : on ouvre une socket depuis
      # le shell. /dev/tcp est une extension **bash** — il faut donc invoquer
      # bash explicitement. Avec CMD-SHELL, Docker passe par /bin/sh, qui est
      # dash dans cette image et repond "Directory nonexistent" : la sonde
      # echouait systematiquement et, avec depends_on: service_healthy,
      # l'API ne demarrait jamais.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- Services des milestones suivants (feuille de route) ---
  # langfuse:    # M4 — observabilite / tracing
  #   image: langfuse/langfuse

volumes:
  qdrant_storage:
