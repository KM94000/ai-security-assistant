name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # sentence-transformers tire torch (~200 Mo). Sans cache, chaque job
          # de chaque PR le retelecharge integralement.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dependances
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (black)
        run: black --check .
      - name: Types (mypy)
        run: mypy src
      - name: Tests (pytest)
        run: pytest

  # Garde-fou DevSecOps : un code vulnerable ou fuyant un secret
  # ne peut pas atteindre main. Reference : docs/SECURITY.md, SEC-15.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scanne tout l'historique, pas juste le diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dependances
        run: pip install -e ".[dev]"
      - name: Secrets commites (gitleaks)
        # Binaire plutot que gitleaks/gitleaks-action@v2 : cette action est une
        # action Node, cassee par la migration forcee des runners de Node 20
        # vers Node 24. Le binaire n'a aucune dependance de runtime, donc rien
        # que GitHub puisse deprecier sous nos pieds.
        #
        # Bonus : c'est exactement le binaire que lance le hook pre-commit, a la
        # meme version. Local et CI donnent le meme verdict, ce qui n'etait pas
        # garanti avec l'action.
        #
        # curl -f : sans lui, une erreur HTTP est ecrite dans l'archive et
        # l'echec se manifeste plus loin, dans tar, avec un message opaque.
        env:
          # Doit rester alignee avec la rev de .pre-commit-config.yaml
          GITLEAKS_VERSION: "8.30.0"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner
      - name: Dependances vulnerables (pip-audit)
        # --skip-editable : notre propre paquet est installe en editable et
        # n'existe pas sur PyPI. Le code applicatif est de toute facon couvert
        # par bandit, pas par pip-audit.
        # Pas de --strict : ce flag fait echouer sur toute dependance *ignoree*
        # (donc sur notre paquet editable), pas sur les vulnerabilites. Une
        # vulnerabilite trouvee fait deja sortir pip-audit en code 1.
        run: pip-audit --skip-editable
      - name: SAST du code applicatif (bandit)
        run: bandit -r src -c pyproject.toml

  # Ticket 18 : les tests d'integration tournent en CI, contre un vrai Qdrant.
  #
  # C'est le job qui manquait, et son absence a coute cher : le healthcheck du
  # docker-compose etait casse depuis le ticket 9 et passait ruff, mypy, 104
  # tests, trois scans de securite et `docker compose config`. Aucun controle
  # statique ne demarre de conteneur — seul un vrai demarrage revele ce genre
  # de defaut.
  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - 6333:6333
        # Meme piege que dans docker-compose : l'image n'a ni curl, ni wget, ni
        # nc, et /dev/tcp est une extension bash alors que le shell par defaut
        # est dash. D'ou l'invocation explicite de bash.
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dependances
        run: pip install -e ".[dev]"
      - name: Cache du modele d'embeddings
        # Le modele pese ~220 Mo. Sans cache, chaque execution le retelecharge
        # depuis Hugging Face, ce qui allonge le job et depend de la
        # disponibilite d'un service tiers.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('src/aisecassist/config.py') }}
          restore-keys: huggingface-
      - name: Tests d'integration
        # `not llm` exclut les tests qui exigent un serveur Ollama : 4,9 Go de
        # poids ne se telechargent pas raisonnablement a chaque execution. Ces
        # tests restent a lancer en local avec `pytest -m integration`.
        run: pytest -m "integration and not llm" -v
